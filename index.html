<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT-6 World Gallery</title>
<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
             "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe9f3; font: 14px/1.4 system-ui, sans-serif; color: #222; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; background: rgba(255,255,255,.92); border: 1px solid #ccd; border-radius: 8px; padding: 10px 12px; max-width: 420px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  #panel h1 { font-size: 16px; margin: 0 0 8px; }
  #panel label { margin-right: 10px; }
  select { font: inherit; padding: 2px 4px; }
  #caption { margin-top: 8px; color: #444; font-size: 13px; }
  #status { margin-top: 4px; color: #a33; font-size: 12px; white-space: pre-wrap; }
  #hint { position: fixed; right: 12px; bottom: 10px; color: #556; font-size: 12px; background: rgba(255,255,255,.7); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="panel">
  <h1>GPT-6 World Gallery</h1>
  <label>Scene <select id="scene"></select></label>
  <label>Camera <select id="cam"></select></label>
  <div id="caption"></div>
  <div id="status"></div>
</div>
<div id="hint">drag to orbit · right-drag to pan · wheel to zoom</div>
<script type="module" src="./gallery.js"></script>
